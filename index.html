<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>오늘도 선물</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8ccbe9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 색은 박반장 카드 원화에서 가져왔다 */
  :root {
    --ink: #15110f;
    --yellow: #f0d153;
    --yellow-deep: #d6ba4a;
    --blue: #6a97c5;
    --sky: #8ccbe9;
    --cloud: #a9d3e6;
    --green: #6baf5e;
    --green-deep: #52a355;
    --skin: #f0e5e5;
    --red: #ce4646;
    --pink: #dc5c9e;
    --cream: #f3f2d0;
    --white: #fffefb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--cream);
    font-family: 'Gaegu', 'Nanum Pen Script', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #stage {
    position: absolute; top: 0; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: min(100vw, 62vh);
    background: var(--sky);
    overflow: hidden;
    border-left: 5px solid var(--ink); border-right: 5px solid var(--ink);
  }
  @media (max-aspect-ratio: 62/100) { #stage { border: 0; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(12px + env(safe-area-inset-top)) 14px 0;
    display: none; gap: 10px; align-items: center;
    pointer-events: none;
  }
  .pill {
    background: var(--white); border: 4px solid var(--ink); border-radius: 999px;
    padding: 2px 16px; font-size: 26px; font-weight: 700; white-space: nowrap;
  }
  #bar { flex: 1; height: 26px; background: var(--white); border: 4px solid var(--ink); border-radius: 999px; overflow: hidden; }
  #barfill { height: 100%; width: 100%; background: var(--yellow); border-right: 4px solid var(--ink); }
  #mute {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--ink); background: var(--white);
    font: inherit; font-size: 20px; padding: 0; cursor: pointer;
  }

  /* 화면 공통 */
  .screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .screen.on { display: flex; }
  h1 {
    margin: 0; font-size: clamp(60px, 19vh, 132px); line-height: .95; font-weight: 700;
    letter-spacing: -2px;
  }
  @media (max-width: 62vh) { h1 { font-size: clamp(60px, 26vw, 132px); } }
  h1 span { display: inline-block; }
  h1 .gift { color: var(--red); }
  .sub { font-size: 26px; margin: 10px 0 0; }
  .btn {
    font: inherit; font-size: 32px; font-weight: 700; color: var(--ink);
    background: var(--yellow); border: 5px solid var(--ink); border-radius: 999px;
    padding: 10px 34px; cursor: pointer;
    box-shadow: 0 7px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .btn.ghost { background: var(--white); font-size: 26px; padding: 6px 26px; }

  /* 타이틀 */
  #title { justify-content: flex-start; padding-top: 9vh; }
  #title { padding-top: 6vh; }
  #title .hero { height: 24vh; margin: 1vh 0 1vh; animation: bob 2.4s ease-in-out infinite; }
  #title .how {
    font-size: 23px; background: var(--white); border: 4px solid var(--ink);
    border-radius: 18px; padding: 8px 18px; margin: 0 0 22px; line-height: 1.35;
  }
  #best { font-size: 22px; margin-top: 16px; min-height: 26px; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }

  /* 선물 열기 */
  #open { background: rgba(140, 203, 233, .86); }
  #open .big { font-size: min(46px, 10.5vw); white-space: nowrap; font-weight: 700; margin: 0 0 6px; }
  #box { width: 46%; max-width: 260px; cursor: pointer; animation: shake 1.1s ease-in-out infinite; }
  @keyframes shake {
    0%,60%,100% { transform: rotate(0); }
    10%,30%,50% { transform: rotate(-7deg); } 20%,40% { transform: rotate(7deg); }
  }
  #box.pop { animation: pop .35s ease-in forwards; }
  @keyframes pop { to { transform: scale(1.7); opacity: 0; } }

  /* 결과 */
  #result { background: rgba(140, 203, 233, .9); justify-content: center; gap: 0; }
  #result .label { font-size: 26px; margin: 0 0 8px; background: var(--white); border: 4px solid var(--ink); border-radius: 999px; padding: 0 18px; }
  #card {
    width: min(74%, 42vh); background: var(--white);
    border: 5px solid var(--ink); border-radius: 14px; overflow: hidden;
    box-shadow: 8px 9px 0 var(--ink);
    transform: rotate(-2deg);
    animation: cardin .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  #card img { display: block; width: 100%; }
  @keyframes cardin { from { transform: translateY(60px) rotate(8deg) scale(.6); opacity: 0; } }
  #msg { font-size: min(27px, 6.2vw); line-height: 1.3; margin: 20px 6px 4px; font-weight: 700; word-break: keep-all; }
  #tally { font-size: 22px; margin: 2px 0 16px; }
  #result .row { position: relative; z-index: 1; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #cheer { position: absolute; bottom: 0; left: 1%; height: 17vh; pointer-events: none; }

  /* ───── 천천히 즐기기 (어르신용): 큰 글씨, 또렷한 고딕, 시간 제한 없음 ─────
     --u = 화면 너비의 1% (스크립트가 넣어 준다) */
  .senior {
    background: var(--cream); justify-content: flex-start;
    padding: calc(var(--u) * 4);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-weight: 700;
  }
  .senior .top { display: flex; width: 100%; align-items: center; gap: calc(var(--u) * 3); margin-bottom: calc(var(--u) * 2); }
  .senior h2 { font-size: calc(var(--u) * 7.5); margin: 0; }
  .senior .lead { font-size: calc(var(--u) * 5.2); line-height: 1.4; margin: 0 0 calc(var(--u) * 3); word-break: keep-all; }
  .back, .chip, .wide {
    font: inherit; color: var(--ink); background: var(--white); cursor: pointer;
    border: 4px solid var(--ink); border-radius: 999px;
    font-size: calc(var(--u) * 4.8); padding: calc(var(--u) * 1.4) calc(var(--u) * 4);
  }
  .chip.on { background: var(--yellow); }
  .wide { background: var(--yellow); font-size: calc(var(--u) * 6); padding: calc(var(--u) * 2) calc(var(--u) * 8); box-shadow: 0 6px 0 var(--ink); margin-top: calc(var(--u) * 3.5); }
  .wide:disabled { background: var(--white); box-shadow: none; opacity: .75; }
  .big-btn {
    width: 100%; display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    font: inherit; color: var(--ink); cursor: pointer;
    border: 5px solid var(--ink); border-radius: calc(var(--u) * 5);
    padding: calc(var(--u) * 4) calc(var(--u) * 6); margin-bottom: calc(var(--u) * 4);
    box-shadow: 0 7px 0 var(--ink);
  }
  .big-btn:active, .wide:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .big-btn b { font-size: calc(var(--u) * 8.5); }
  .big-btn span { font-size: calc(var(--u) * 5); font-weight: 400; }
  #pics { display: flex; gap: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * 2.5); }
  #pics .chip { font-size: calc(var(--u) * 4.3); padding: calc(var(--u) * 1.4) calc(var(--u) * 2.4); white-space: nowrap; }
  #paint { width: calc(var(--u) * 68); aspect-ratio: 1; background: var(--white); border: 5px solid var(--ink); border-radius: calc(var(--u) * 4); }
  #paint .rg { cursor: pointer; }
  #palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 2.5); width: calc(var(--u) * 84); margin-top: calc(var(--u) * 3.5); }
  .sw { aspect-ratio: 1.55; border-radius: calc(var(--u) * 3); border: 4px solid var(--ink); cursor: pointer; padding: 0; }
  .sw.on { outline: 6px solid var(--ink); outline-offset: 3px; transform: scale(1.06); }
  #grid { display: grid; gap: calc(var(--u) * 3); width: 100%; }
  .mcard {
    font: inherit; color: var(--ink); padding: 0; cursor: pointer;
    border: 5px solid var(--ink); border-radius: calc(var(--u) * 4);
    background: var(--yellow); display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 12);
  }
  .mcard img { height: 62%; display: none; }
  .mcard small { font-size: calc(var(--u) * 4.6); display: none; }
  .mcard.up { background: var(--white); }
  .mcard.up img, .mcard.up small { display: block; }
  .mcard.up .q { display: none; }
  .mcard.matched { background: #d9efd3; border-color: var(--green-deep); }
  #traceSvg { width: calc(var(--u) * 84); aspect-ratio: 300 / 360; background: var(--white); border: 5px solid var(--ink); border-radius: calc(var(--u) * 4); }
  #step { font-size: calc(var(--u) * 5); margin-top: calc(var(--u) * 2.5); }
  /* 천천히 즐기기에서 온 결과 화면은 글씨를 더 크고 또렷하게 */
  #result.big { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  #result.big .label { font-size: calc(var(--u) * 4.6); font-weight: 700; }
  #result.big #msg { font-size: calc(var(--u) * 5.4); }
  #result.big #tally { font-size: calc(var(--u) * 4.2); }
  #result.big #card { width: min(64%, 38vh); }
  #slowBtn { margin-top: 16px; }
  #title .tiny { font-size: 20px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="pill">선물 <span id="score">0</span></div>
    <div id="bar"><div id="barfill"></div></div>
    <button id="mute" aria-label="소리 켜기/끄기">♪</button>
  </div>

  <section id="title" class="screen on">
    <h1><span>오늘도</span><br><span class="gift">선물</span></h1>
    <p class="sub">하늘에서 선물이 내려와요</p>
    <img class="hero" src="assets/player.png" alt="편지봉투를 탄 박반장">
    <p class="how">손가락으로 좌우로 움직여<br><span id="secs">40</span>초 동안 선물을 받아 주세요</p>
    <button class="btn" id="start">선물 받으러 가기</button>
    <button class="btn ghost" id="slowBtn">천천히 즐기기</button>
    <div id="best"></div>
  </section>

  <!-- 천천히 즐기기: 고르는 화면 -->
  <section id="slow" class="screen senior">
    <div class="top"><button class="back" data-to="title">← 처음으로</button></div>
    <h2>천천히 즐기기</h2>
    <p class="lead" style="margin-top:calc(var(--u)*2)">시간 제한이 없어요.<br>마음 편히, 천천히 하세요.</p>
    <button class="big-btn" data-go="color" style="background:var(--yellow)"><b>색칠하기</b><span>마음 가는 색으로 칠해요</span></button>
    <button class="big-btn" data-go="memory" style="background:var(--cloud)"><b>짝 맞추기</b><span>같은 선물 두 장을 찾아요</span></button>
    <button class="big-btn" data-go="trace" style="background:var(--white)"><b>선 따라 긋기</b><span>손가락으로 점선을 따라가요</span></button>
  </section>

  <section id="color" class="screen senior">
    <div class="top"><button class="back" data-to="slow">← 뒤로</button><h2>색칠하기</h2></div>
    <p class="lead">색을 고르고, 그림을 눌러 주세요</p>
    <div id="pics"></div>
    <svg id="paint" viewBox="0 0 300 300"></svg>
    <div id="palette"></div>
    <button class="wide" id="colorDone" disabled></button>
  </section>

  <section id="memory" class="screen senior">
    <div class="top"><button class="back" data-to="slow">← 뒤로</button><h2>짝 맞추기</h2></div>
    <p class="lead" id="memLead">카드를 눌러 같은 그림 두 장을 찾아 주세요</p>
    <div id="grid"></div>
  </section>

  <section id="trace" class="screen senior">
    <div class="top"><button class="back" data-to="slow">← 뒤로</button><h2>선 따라 긋기</h2></div>
    <p class="lead">초록 점에서 시작해<br>점선을 손가락으로 따라가 주세요</p>
    <svg id="traceSvg" viewBox="0 0 300 360"></svg>
    <div id="step"></div>
  </section>

  <section id="open" class="screen">
    <p class="big">선물이 도착했어요!</p>
    <p class="sub" style="margin:0 0 18px">톡, 눌러서 열어 보세요</p>
    <svg id="box" viewBox="0 0 200 200" role="button" aria-label="선물 열기">
      <g stroke="#15110f" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <rect x="32" y="84" width="136" height="100" fill="#f0d153"/>
        <rect x="20" y="58" width="160" height="34" fill="#f0d153"/>
        <rect x="88" y="58" width="24" height="126" fill="#ce4646"/>
        <path d="M100 56 C70 10, 30 26, 52 52 C66 62, 88 58, 100 56Z" fill="#ce4646"/>
        <path d="M100 56 C130 10, 170 26, 148 52 C134 62, 112 58, 100 56Z" fill="#ce4646"/>
      </g>
    </svg>
  </section>

  <section id="result" class="screen">
    <p class="label">오늘 당신에게 도착한 선물</p>
    <div id="card"><img id="cardimg" alt=""></div>
    <p id="msg"></p>
    <p id="tally"></p>
    <div class="row">
      <button class="btn" id="again">한 번 더</button>
      <button class="btn ghost" id="home">처음으로</button>
    </div>
    <img id="cheer" src="assets/cheer.png" alt="">
  </section>
</div>

<script>
(() => {
  'use strict';

  // ───────── 설정 (부스에서 바꾸고 싶으면 여기만) ─────────
  // 한 판 길이(초). 주소 끝에 ?t=30 처럼 붙이면 그 판만 길이를 바꿀 수 있다
  const GAME_SECONDS = Math.max(3, +new URLSearchParams(location.search).get('t') || 40);
  // ── 선물 받기 단계표 ──
  // 지금은 시연용이라 단계가 하나뿐이다. 나중에 여러 단계로 늘리려면
  // 아래 목록에 { ... } 한 줄씩 더 넣으면 된다. 한 단계가 끝나면 점수를 이어서 다음 단계로 넘어가고,
  // 마지막 단계가 끝나야 선물 상자가 열린다.
  //   seconds : 그 단계의 길이(초)
  //   pace    : [몇 초부터, 빠르기 배율] — 1.0 = 보통. 한 줄만 두면 처음부터 끝까지 같은 속도
  //   rain    : 빗방울이 섞이는 비율 (0 ~ 1)
  const LEVELS = [
    { seconds: GAME_SECONDS, pace: [[0, 1.0]], rain: 0.16 },   // 시연용: 처음부터 끝까지 보통 속도
    // 예) { seconds: 40, pace: [[0, 1.0], [20, 1.15]], rain: 0.2 },
    // 예) { seconds: 40, pace: [[0, 1.2], [20, 1.35]], rain: 0.25 },
  ];
  const IDLE_RESET_SECONDS = 45;  // 결과 화면에서 아무도 안 만지면 처음으로
  const IDLE_SLOW_SECONDS = 180;  // 천천히 즐기기 도중 자리를 뜨면 처음으로 (어르신 속도에 맞춰 넉넉히)

  const INK = '#15110f', YELLOW = '#f0d153', BLUE = '#6a97c5', CLOUD = '#a9d3e6',
        GREEN = '#6baf5e', GREEN_DEEP = '#52a355', RED = '#ce4646', PINK = '#dc5c9e',
        CREAM = '#f3f2d0', WHITE = '#fffefb';

  // 선물 종류 → 결과로 열리는 카드
  const GIFTS = {
    special: { name: '선물상자', img: 'assets/card_special.jpg',
      msg: '오늘이라는 선물을 제일 많이 받았어요.<br>오늘도, 당신에게 온 선물이에요.' },
    love:    { name: '하트', img: 'assets/card_love.jpg',
      msg: '마음을 제일 많이 받았어요.<br>당신도 이미 누군가의 선물이에요.' },
    lucky:   { name: '클로버', img: 'assets/card_lucky.jpg',
      msg: '행운을 제일 많이 받았어요.<br>좋은 일이 당신 쪽으로 오고 있어요.' },
    nice:    { name: '칭찬공', img: 'assets/card_nice.jpg',
      msg: '칭찬을 제일 많이 받았어요.<br>당신에겐 분명 빛나는 지점이 있어요.' },
    letter:  { name: '편지', img: 'assets/card_letter.jpg',
      msg: '편지를 제일 많이 받았어요.<br>걱정 말아요, 잘 될 거예요.' },
  };
  const KINDS = Object.keys(GIFTS);
  const WORDS = ['nice', 'Good', 'wow', 'Great', 'Cool', 'oh!', 'perfect', 'Awesome', 'superb', 'Better'];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('c');
  let ctx = cv.getContext('2d');
  const W = 720; let H = 1280, scale = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    scale = cv.width / W; H = cv.height / scale;
    stage.style.setProperty('--u', (r.width / 100) + 'px');
  }
  window.addEventListener('resize', resize); resize();

  const playerImg = new Image(); playerImg.src = 'assets/player.png';
  KINDS.forEach(k => { const i = new Image(); i.src = GIFTS[k].img; }); // 미리 불러두기

  // ───────── 소리 (짧은 효과음만) ─────────
  let ac = null, muted = false;
  function beep(freq, dur = 0.09, type = 'sine', vol = 0.12) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  $('mute').addEventListener('click', e => {
    muted = !muted; e.currentTarget.textContent = muted ? '×' : '♪';
  });

  // ───────── 그리기 도구: 굵은 검정 외곽선 + 단색 ─────────
  function ink(fill, lw = 6) {
    ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.fillStyle = fill;
    ctx.stroke(); ctx.fill();
  }
  // 원 여러 개를 한 덩어리처럼 (구름·클로버)
  function blob(circles, fill, lw = 6) {
    ctx.lineWidth = lw * 2; ctx.strokeStyle = INK; ctx.fillStyle = fill;
    for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); }
    for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  }
  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.8, -s * 1.2, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.8, -s * 1.2, s * 1.5, -s * 0.1, 0, s * 0.9);

  const draw = {

    love() { heartPath(36); ink(PINK); },
    lucky() {

      ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();

    rain() {

  };

  // ───────── 배경 ─────────
  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: Math.random() * W, y: 150 + i * 190 + Math.random() * 60,
    s: 0.7 + Math.random() * 0.6, v: 8 + Math.random() * 14, white: i % 2 === 0,
  }));
  function drawCloud(c) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    blob([[-50, 8, 30], [-12, -12, 40], [36, 2, 34], [68, 14, 22]], c.white ? WHITE : CLOUD, 5);
    ctx.restore();
  }
  function drawGround() {
    const g = H - 150;
    ctx.beginPath(); ctx.moveTo(-20, H + 20); ctx.lineTo(-20, g + 50);
    ctx.bezierCurveTo(60, g - 40, 200, g - 30, 250, g + 30);
    ctx.bezierCurveTo(320, g - 50, 520, g - 60, 560, g + 20);
    ctx.bezierCurveTo(620, g - 20, 700, g - 10, 740, g + 40);
    ctx.lineTo(740, H + 20); ctx.closePath(); ink(GREEN, 7);
    // 풀 무늬 (카드 원화의 짧은 사선)
    ctx.strokeStyle = GREEN_DEEP; ctx.lineWidth = 12; ctx.lineCap = 'round';
    for (const [x, y, a] of [[70, 60, -1], [190, 110, 1], [330, 50, -1], [440, 105, 1], [560, 70, -1], [660, 115, 1], [120, 125, 1]]) {
      ctx.beginPath(); ctx.moveTo(x - 12, g + y + 10 * a); ctx.lineTo(x + 12, g + y - 10 * a); ctx.stroke();
    }
  }
  function drawBackground(dt) {
    ctx.fillStyle = '#8ccbe9'; ctx.fillRect(0, 0, W, H);
    for (const c of clouds) {
      c.x += c.v * dt; if (c.x > W + 120) c.x = -120;
      drawCloud(c);
    }
    drawGround();
  }

  // ───────── 게임 상태 ─────────
  let state = 'title';       // title | play | open | result
  let items = [], pops = [], confetti = [];
  let counts = {}, score = 0, timeLeft = 0, spawnIn = 0, elapsed = 0;
  let px = W / 2, targetX = W / 2, tilt = 0, wobble = 0, squash = 0;
  let resultKind = 'special', idle = 0, stageNow = 0, lv = 0;
  function beginLevel() {

  function show(id) {
    for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);

  function startGame() {
    items = []; pops = []; confetti = [];

      rot: (Math.random() - 0.5) * 0.5, vr: kind === 'rain' ? 0 : (Math.random() - 0.5) * 0.7,

  function endGame() {

  function openBox() {

  // 결과 카드 화면 (선물 받기·천천히 즐기기 공용)
  let againFn = () => {}, homeFn = () => {};

  function goTitle() {

  // ───────── 조작: 손가락/마우스 좌우, 키보드 ←→ ─────────
  function pointerX(e) {
    const r = cv.getBoundingClientRect();

  }
  stage.addEventListener('pointerdown', e => { idle = 0; if (state === 'play') targetX = pointerX(e); });
  stage.addEventListener('pointermove', e => {
    if (state === 'play' && (e.pointerType !== 'mouse' || true)) targetX = pointerX(e);
  });
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true; idle = 0;
    if (e.key === ' ' || e.key === 'Enter') {

  $('start').addEventListener('click', startGame);
  $('again').addEventListener('click', () => againFn());

  // ═════════ 천천히 즐기기 (어르신용) ═════════
  // 원칙: 시간 제한 없음 · 틀려도 감점 없음 · 큰 글씨와 큰 버튼 · 한 화면에 한 가지 일

  $('slowBtn').addEventListener('click', goSlow);
  for (const b of document.querySelectorAll('[data-to]'))
    b.addEventListener('click', () => (b.dataset.to === 'title' ? goTitle() : goSlow()));
  const SLOW = { color: startColor, memory: () => startMemory(0), trace: () => startTrace(0) };
  for (const b of document.querySelectorAll('[data-go]'))
    b.addEventListener('click', () => { beep(660, 0.1); SLOW[b.dataset.go](); });

  // 선물 그림을 작은 이미지로 (짝 맞추기 카드·선 긋기 도착점에 쓴다)
  const iconCache = {};
  function icon(kind) {
    if (iconCache[kind]) return iconCache[kind];
    const c = document.createElement('canvas'); c.width = c.height = 170;
    const main = ctx; ctx = c.getContext('2d');
    ctx.translate(85, 90); ctx.scale(1.25, 1.25); draw[kind]({ word: 'Good' });
    ctx = main;
    return (iconCache[kind] = c.toDataURL());
  }

  // ── 1. 색칠하기 ──
  const HEART = 'M0 0 C-62 -42,-46 -98,0 -64 C46 -98,62 -42,0 0Z';
  const PICS = {
    gift: { name: '선물', shapes: [
      '<rect x="50" y="130" width="85" height="125"/>', '<rect x="165" y="130" width="85" height="125"/>',
      '<rect x="135" y="130" width="30" height="125"/>',
      '<rect x="38" y="95" width="97" height="35"/>', '<rect x="165" y="95" width="97" height="35"/>',
      '<rect x="135" y="95" width="30" height="35"/>',
      '<path d="M150 93 C110 25,45 48,78 84 C100 100,135 96,150 93Z"/>',
      '<path d="M150 93 C190 25,255 48,222 84 C200 100,165 96,150 93Z"/>',
      '<circle cx="150" cy="90" r="14"/>',
    ] },
    clover: { name: '클로버', shapes: [

      ...[0, 90, 180, 270].map(a => `<path transform="translate(150 145) rotate(${a})" d="${HEART}"/>`),

      '<rect x="40" y="100" width="220" height="150"/>',
      '<path d="M40 100 L150 185 L260 100Z"/>',

    cherry: { name: '체리', shapes: [
      '<path d="M144 76 L156 80 L106 190 L92 184Z"/>', '<path d="M156 76 L144 80 L194 190 L208 184Z"/>',
      '<circle cx="92" cy="220" r="42"/>', '<circle cx="208" cy="220" r="42"/>',
      '<ellipse cx="108" cy="58" rx="46" ry="24" transform="rotate(-14 108 58)"/>',

    cake: { name: '케이크', shapes: [
      '<ellipse cx="150" cy="252" rx="118" ry="18"/>',
      '<rect x="58" y="182" width="184" height="68" rx="8"/>',
      '<rect x="88" y="126" width="124" height="58" rx="8"/>',
      '<rect x="116" y="80" width="68" height="48" rx="8"/>',
      '<rect x="142" y="46" width="16" height="36"/>',
      '<ellipse cx="150" cy="32" rx="10" ry="14"/>',
    ] },
  };
  const COLORS = ['#f0d153', '#ce4646', '#dc5c9e', '#e8954a', '#6baf5e', '#6a97c5', '#a9d3e6', '#f3f2d0'];
  let brush = COLORS[0], pic = 'gift';

  function startColor() {
    state = 'slow'; show('color');
    $('pics').innerHTML = Object.keys(PICS).map(k =>
      `<button class="chip${k === pic ? ' on' : ''}" data-pic="${k}">${PICS[k].name}</button>`).join('');
    $('palette').innerHTML = COLORS.map(c =>
      `<button class="sw${c === brush ? ' on' : ''}" data-c="${c}" style="background:${c}" aria-label="색"></button>`).join('');
    $('paint').innerHTML = `<g stroke="${INK}" stroke-width="5" stroke-linejoin="round" fill="${WHITE}">` +
      PICS[pic].shapes.map(s => s.replace(/^<(\w+)/, '<$1 class="rg"')).join('') + '</g>';
    colorProgress();
  }
  function colorProgress() {
    const left = [...$('paint').querySelectorAll('.rg')].filter(r => !r.dataset.done).length;
    $('colorDone').disabled = left > 0;
    $('colorDone').textContent = left > 0 ? `남은 곳 ${left}군데` : '다 칠했어요!';
  }
  $('pics').addEventListener('click', e => {
    const b = e.target.closest('[data-pic]'); if (!b) return;
    pic = b.dataset.pic; startColor();
  });
  $('palette').addEventListener('click', e => {
    const b = e.target.closest('.sw'); if (!b) return;
    brush = b.dataset.c; beep(520, 0.06);
    for (const s of $('palette').children) s.classList.toggle('on', s === b);
  });
  $('paint').addEventListener('pointerdown', e => {
    const r = e.target.closest('.rg'); if (!r) return;
    r.setAttribute('fill', brush); r.dataset.done = 1;
    beep(700 + COLORS.indexOf(brush) * 40, 0.08);
    colorProgress();
  });
  $('colorDone').addEventListener('click', () =>
    celebrate('love', '곱게 칠하셨어요.<br>고르신 색이 참 잘 어울려요.', `${PICS[pic].name} 그림 완성`, startColor, goSlow));

  // ── 2. 짝 맞추기 (2쌍 → 3쌍 → 4쌍 → 5쌍 → 6쌍) ──
  const MEM_LEVELS = [2, 3, 4, 5, 6];
  const MEM_PREVIEW = [5, 4, 3, 2.5, 2];   // 단계마다 처음에 전체를 보여 주는 시간(초) — 갈수록 짧아진다
  const MEM_MISS_MS = 700;                 // 틀렸을 때 두 장을 보여 주는 시간 (그 전에 다른 카드를 누르면 바로 덮인다)
  const MEM_KINDS = ['special', 'love', 'lucky', 'letter', 'nice', 'rain'];
  const MEM_NAMES = { special: '선물', love: '하트', lucky: '클로버', letter: '편지', nice: '칭찬공', rain: '빗방울' };
  let memLevel = 0, memFirst = null, memLock = false, memLeft = 0, memRun = 0;

  function startMemory(level) {
    state = 'slow'; show('memory');
    memLevel = level; memFirst = null;
    const pairs = MEM_LEVELS[level]; memLeft = pairs;
    const kinds = MEM_KINDS.slice().sort(() => Math.random() - 0.5).slice(0, pairs);
    const deck = [...kinds, ...kinds].sort(() => Math.random() - 0.5);
    const cols = pairs <= 3 ? 2 : 3, h = pairs >= 5 ? 24 : pairs === 4 ? 30 : 32;
    $('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    // 시작할 때 전체를 앞면으로 한 번 보여 주고, 잠시 뒤에 뒤집는다
    $('grid').innerHTML = deck.map(k =>
      `<button class="mcard up" data-k="${k}" style="height:calc(var(--u)*${h})">` +
      `<span class="q">?</span><img src="${icon(k)}" alt=""><small>${MEM_NAMES[k]}</small></button>`).join('');
    const stepText = `(${level + 1}/${MEM_LEVELS.length}단계)`;
    $('memLead').textContent = `먼저 그림을 잘 봐 두세요. 다 보셨으면 눌러 주세요 ${stepText}`;
    memPreview = true; memMiss = null;
    const run = ++memRun;
    memHide = () => {
      if (run !== memRun || !memPreview) return;   // 이미 덮었거나 다른 화면으로 갔으면 무시
      memPreview = false;
      for (const c of $('grid').children) c.classList.remove('up');
      $('memLead').textContent = `카드를 눌러 같은 그림 두 장을 찾아 주세요 ${stepText}`;
      beep(520, 0.1);
    };
    setTimeout(memHide, MEM_PREVIEW[level] * 1000);
  }
  let memPreview = false, memHide = () => {}, memMiss = null;
  function memClearMiss() {          // 틀린 두 장을 바로 덮는다
    if (!memMiss) return;
    clearTimeout(memMiss.timer);
    memMiss.a.classList.remove('up'); memMiss.b.classList.remove('up');
    memMiss = null;
  }
  $('grid').addEventListener('click', e => {
    if (memPreview) { memHide(); return; }      // 미리 보기 중에 누르면 기다리지 않고 바로 시작
    const c = e.target.closest('.mcard');
    if (!c) return;
    if (memMiss && c !== memMiss.a && c !== memMiss.b) memClearMiss();   // 틀린 카드가 떠 있어도 바로 다음 카드를 누를 수 있다
    if (memMiss || c.classList.contains('up')) return;
    c.classList.add('up'); beep(560, 0.07);
    if (!memFirst) { memFirst = c; return; }
    const a = memFirst; memFirst = null;
    if (a.dataset.k === c.dataset.k) {
      a.classList.add('matched'); c.classList.add('matched');
      beep(784, 0.1); setTimeout(() => beep(988, 0.14), 100);
      if (--memLeft === 0) setTimeout(() => {
        if (memLevel + 1 < MEM_LEVELS.length) startMemory(memLevel + 1);
        else celebrate('nice', '모두 찾으셨어요.<br>찬찬히 보는 눈이 빛나요.', `짝 맞추기 ${MEM_LEVELS.length}단계 완성`, () => startMemory(0), goSlow);
      }, 700);
    } else {
      memMiss = { a, b: c, timer: setTimeout(memClearMiss, MEM_MISS_MS) };
    }
  });

  // ── 3. 선 따라 긋기 (곧은 길 → 물결 → 산 → 하트 → 별) ──
  const TRACES = [
    { name: '곧은 길', d: 'M50 300 L250 70' },
    { name: '물결', d: 'M40 180 C90 70,130 70,150 180 S230 290,260 180' },
    { name: '산', d: 'M40 290 L110 90 L150 230 L200 90 L260 290' },
    { name: '하트', d: 'M150 310 C10 210,40 60,150 135 C260 60,290 210,150 310', end: [150, 205] },
    { name: '별', d: 'M150 65 L179.4 144.5 L264.1 147.9 L197.6 200.5 L220.5 282.1 L150 235 L79.5 282.1 L102.4 200.5 L35.9 147.9 L120.6 144.5 L150 65', end: [150, 190] },
  ];
  let trLevel = 0, trPts = [], trIdx = 0, trLen = 0, trDone = false;

  function startTrace(level) {
    state = 'slow'; show('trace');
    trLevel = level; trIdx = 0; trDone = false;
    const t = TRACES[level], svg = $('traceSvg');
    svg.innerHTML =
      `<path id="trBase" d="${t.d}" fill="none" stroke="#a9d3e6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 26"/>` +
      `<path id="trInk" d="${t.d}" fill="none" stroke="${PINK}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<image id="trGoal" width="64" height="64" href="${icon('special')}"/>` +
      `<circle id="trHead" r="20" fill="${GREEN}" stroke="${INK}" stroke-width="5"/>`;
    const base = $('trBase'); trLen = base.getTotalLength(); trPts = [];
    for (let l = 0; l <= trLen; l += 3) { const p = base.getPointAtLength(l); trPts.push([p.x, p.y]); }
    const [ex, ey] = t.end || trPts[trPts.length - 1];
    $('trGoal').setAttribute('x', ex - 32); $('trGoal').setAttribute('y', ey - 36);
    $('trInk').setAttribute('stroke-dasharray', `0 ${trLen + 10}`);
    $('step').textContent = `${t.name} 모양 · ${level + 1}/${TRACES.length}단계`;
    traceDraw();
  }
  function traceDraw() {
    const [x, y] = trPts[trIdx];
    $('trHead').setAttribute('cx', x); $('trHead').setAttribute('cy', y);
    $('trHead').setAttribute('fill', trIdx ? YELLOW : GREEN);
    $('trInk').setAttribute('stroke-dasharray', `${trIdx * 3} ${trLen + 10}`);
  }
  function traceMove(e) {
    idle = 0;
    if (trDone || !(e.buttons || e.pointerType === 'touch')) return;
    const r = $('traceSvg').getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 300, y = (e.clientY - r.top) / r.height * 360;
    const before = trIdx;
    // 손가락이 선에서 조금 벗어나도 괜찮도록 넉넉하게 받아 준다
    while (trIdx < trPts.length - 1 && Math.hypot(x - trPts[trIdx + 1][0], y - trPts[trIdx + 1][1]) < 34) trIdx++;
    if (trIdx === before) return;
    traceDraw();
    if (trIdx % 12 === 0) beep(440 + trIdx / trPts.length * 500, 0.05, 'sine', 0.06);
    if (trIdx >= trPts.length - 1) {
      trDone = true; beep(784, 0.1); setTimeout(() => beep(1047, 0.16), 110);
      setTimeout(() => {
        if (trLevel + 1 < TRACES.length) startTrace(trLevel + 1);
        else celebrate('letter', '끝까지 이으셨어요.<br>그 손끝이 오늘의 선물이에요.', `선 따라 긋기 ${TRACES.length}단계 완성`, () => startTrace(0), goSlow);
      }, 1000);
    }
  }
  $('traceSvg').addEventListener('pointerdown', traceMove);
  $('traceSvg').addEventListener('pointermove', traceMove);
  $('box').addEventListener('click', openBox);
  $('open').addEventListener('click', openBox);

  // ───────── 한 프레임 ─────────
  function update(dt) {
    if (state === 'play') {
      elapsed += dt; timeLeft -= dt;
      $('barfill').style.width = Math.max(0, timeLeft / LEVELS[lv].seconds * 100) + '%';
      const pace = LEVELS[lv].pace;
      if (keys.ArrowLeft) targetX = Math.max(70, targetX - 700 * dt);
      if (keys.ArrowRight) targetX = Math.min(W - 70, targetX + 700 * dt);

      spawnIn -= dt;
      if (spawnIn <= 0 && timeLeft > 1.2) {
        spawn(); spawnIn = 0.6 * (0.75 + Math.random() * 0.5) / pace[stageNow][1];
      }
      // 한 단계 안에서 빨라질 때 화면 가운데에 잠깐 알려 준다
      let next = 0;
      pace.forEach((s, i) => { if (elapsed >= s[0]) next = i; });
      if (next !== stageNow) {
        stageNow = next;
        pops.push({ x: W / 2, y: H * 0.4, t: -0.6, text: '조금 더 빠르게!', color: RED });
        beep(880, 0.12, 'triangle');
      }
      if (timeLeft <= 0) {
        if (lv + 1 < LEVELS.length) {     // 다음 단계가 있으면 점수를 이어서 계속
          lv++; beginLevel();
          pops.push({ x: W / 2, y: H * 0.4, t: -1, text: `${lv + 1}단계!`, color: RED });
          beep(660, 0.12); setTimeout(() => beep(880, 0.15), 110);
        } else endGame();
      }
    }

    const prev = px;
    px += (targetX - px) * Math.min(1, dt * 14);
    tilt += ((px - prev) / Math.max(dt, 0.001) / 2600 - tilt) * Math.min(1, dt * 10);
    tilt = Math.max(-0.22, Math.min(0.22, tilt));
    wobble += dt; squash = Math.max(0, squash - dt * 4);

    const py = H - 285;
    for (const it of items) {
      it.y += it.vy * dt; it.rot += it.vr * dt; it.sway += dt * 2;
      it.x += Math.sin(it.sway) * 18 * dt;
      if (!it.dead && Math.abs(it.x - px) < 105 && Math.abs(it.y - (py + 25)) < 62) {
        it.dead = true; squash = 1;
        if (it.kind === 'rain') {
          pops.push({ x: it.x, y: py - 90, t: 0, text: '괜찮아!', color: BLUE });
          beep(220, 0.18, 'triangle', 0.1);
        } else {
          counts[it.kind]++; score++;
          $('score').textContent = score;
          pops.push({ x: it.x, y: py - 90, t: 0, text: it.kind === 'nice' ? it.word : WORDS[score % WORDS.length], color: INK });
          beep(620 + (score % 6) * 70, 0.09);
        }
      }
      if (it.y > H + 80) it.dead = true;
    }
    items = items.filter(it => !it.dead);
    for (const p of pops) { p.t += dt; p.y -= 90 * dt; }
    pops = pops.filter(p => p.t < 0.8);
    for (const c of confetti) { c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; }
    confetti = confetti.filter(c => c.y < H + 40);

    if (state !== 'title' && state !== 'play') {
      idle += dt;
      if (idle > (state === 'slow' ? IDLE_SLOW_SECONDS : IDLE_RESET_SECONDS)) goTitle();
    }
  }

  function render(dt) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBackground(dt);

    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.scale(1.3, 1.3);
      draw[it.kind](it); ctx.restore();
    }

    if (state === 'play' || state === 'open') {
      const py = H - 285, ph = 290, pw = ph * (playerImg.width / (playerImg.height || 1) || 0.875);
      ctx.save();
      ctx.translate(px, py + Math.sin(wobble * 3) * 8);
      ctx.rotate(tilt);
      ctx.scale(1 + squash * 0.08, 1 - squash * 0.08);
      if (playerImg.complete && playerImg.naturalWidth) ctx.drawImage(playerImg, -pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of pops) {
      ctx.save(); ctx.globalAlpha = Math.min(1, 1 - p.t / 0.8);
      ctx.font = '700 46px Gaegu, sans-serif';
      ctx.lineWidth = 9; ctx.strokeStyle = WHITE; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
    for (const c of confetti) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
      ctx.beginPath(); ctx.rect(-9, -6, 18, 12); ink(c.c, 3); ctx.restore();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    update(dt); render(dt);
    requestAnimationFrame(frame);
  }
  // ═════════ 부스 태블릿용 ═════════
  // 길게 눌러도 메뉴가 안 뜨게, 두 손가락 확대가 안 되게
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('gesturestart', e => e.preventDefault());
  // 화면이 꺼지지 않게 (지원하는 태블릿에서만)
  let wake = null;
  async function keepAwake() {
    try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  // 처음 손을 대면 전체 화면으로 (주소창 숨김)
  window.addEventListener('pointerup', () => {
    keepAwake();
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen && navigator.maxTouchPoints > 0)
      el.requestFullscreen().catch(() => {});
  });
  // 한 번 인터넷으로 열어 두면 그다음부터는 인터넷 없이도 열린다
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    navigator.serviceWorker.register('sw.js').catch(() => {});

  $('secs').textContent = GAME_SECONDS;
  goTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
